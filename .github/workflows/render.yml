name: CI - build and render

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system deps (ffmpeg and Chromium libs)
        run: |
          sudo apt-get update
          # Install FFmpeg and required system libraries for Chromium/Remotion on Ubuntu 24.04 (Noble)
          # Replace libasound2 with libasound2t64 for Noble where libasound2 has no candidate.
          sudo apt-get install -y \
            ffmpeg \
            libasound2t64 \
            libnss3 \
            libxss1 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            fonts-liberation \
            fonts-dejavu-core || true

      - name: Install dependencies
        run: npm install

      - name: Build workspaces
        run: npm run build || true

      - name: Run Remotion render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
        run: |
          cd remotion || exit 1
          npm install
          node ../remotion/render.js ../projects/El-viaje-del-cafe/scene.json ../out/cafe-40s.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafe-40s
          path: remotion/../out/cafe-40s.mp4
