name: CI - build and render

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system deps (ffmpeg, chromium, libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget unzip ca-certificates
          # Install chromium dependencies (common set), adjusted for Ubuntu 24.04 naming
          sudo apt-get install -y libx11-6 libxkbcommon0 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libgbm1 libgtk-3-0 libpango-1.0-0 libxss1 libasound2t64 libnss3 libnspr4 libxcomposite1 libxrandr2 libxdamage1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libepoxy0 || true

      - name: Install dependencies
        run: npm install

      - name: Build workspaces
        run: npm run build || true

      - name: Run Remotion render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
        run: |
          cd remotion || exit 1
          npm install
          node ../remotion/render.js ../projects/El-viaje-del-cafe/scene.json ../out/cafe-40s.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafe-40s
          path: remotion/../out/cafe-40s.mp4
